[project]
name = "tbook"
version = "0.1.0"
description = "Talking Textbook: digester and terminal reader"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
    "openai>=1.40",
    "numpy>=1.26",
    "rich>=13.7",
    "pylatexenc>=2.10",
    "pillow>=10.0",
    "wordfreq>=3.1.1",
]

[project.scripts]
tbook = "tbook.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
